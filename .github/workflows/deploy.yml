# =============================================================================
# .github/workflows/deploy.yml — CI/CD Pipeline for Your Own API
# =============================================================================
# Triggers: every push/PR to the `main` branch
#
# Jobs:
#   1. test     — Install deps, run migrations, execute integration test suite
#   2. deploy   — On successful test, trigger auto-deploy to Railway/Render
#
# Required GitHub Secrets (set in Settings → Secrets → Actions):
#   DEPLOY_WEBHOOK_URL  — Webhook URL from Railway or Render to trigger deploy
#   JWT_SECRET          — Production JWT secret for test environment
# =============================================================================

name: CI/CD — Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # JOB 1: TEST
  # ===========================================================================
  test:
    name: 🧪 Run Integration Tests
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL service container for the test run
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Use PostgreSQL in CI (not SQLite)
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      ENVIRONMENT: testing
      AI_PROVIDER: mock
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_at_least_32_chars_long_ok' }}
      LOG_LEVEL: WARNING
      LOG_DIR: /tmp/yourownapi_logs

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️  Run Alembic migrations
        run: |
          alembic upgrade head

      - name: 🧪 Execute integration test suite
        run: |
          python run_verification.py

      - name: 📊 Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/yourownapi_logs/
          retention-days: 7

  # ===========================================================================
  # JOB 2: DEPLOY (only runs on push to main, not on PRs)
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger deployment webhook
        # This works with Railway, Render, or any platform that provides
        # a deploy webhook URL. Set DEPLOY_WEBHOOK_URL in GitHub Secrets.
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "Triggering deploy webhook..."
            curl -f -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"ref": "main", "commit": "${{ github.sha }}", "message": "${{ github.event.head_commit.message }}"}'
            echo "✅ Deploy webhook triggered successfully."
          else
            echo "⚠️  DEPLOY_WEBHOOK_URL secret not set. Skipping deployment."
            echo "    → Set it in: GitHub Repository → Settings → Secrets → Actions"
          fi

      - name: 📝 Post deploy summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit  | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch  | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status  | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
