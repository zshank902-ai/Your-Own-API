# =============================================================================
# docker-compose.yml — Your Own API Full Stack Orchestration
# =============================================================================
# Services: api (FastAPI/Gunicorn), db (PostgreSQL 15), redis (Redis 7), nginx
# Run: docker-compose up --build -d
# Stop: docker-compose down
# Logs: docker-compose logs -f api
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Named volumes for persistent data
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  app_logs:
    driver: local

# ---------------------------------------------------------------------------
# Custom bridge network so services resolve each other by name
# ---------------------------------------------------------------------------
networks:
  yourownapi_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ─────────────────────────────────────────────────
  # PostgreSQL 15 — Primary Database
  # ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: yourownapi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yourownapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-yourownapi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yourownapi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yourownapi} -d ${POSTGRES_DB:-yourownapi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Do NOT expose port 5432 to host in production — only internal access
    expose:
      - "5432"

  # ─────────────────────────────────────────────────
  # Redis 7 — Caching & Rate Limit Backend
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yourownapi_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yourownapi_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    expose:
      - "6379"

  # ─────────────────────────────────────────────────
  # FastAPI Application (Gunicorn + Uvicorn workers)
  # ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: yourownapi_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override SQLite with PostgreSQL when running in Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-yourownapi}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-yourownapi_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      ENVIRONMENT: production
    volumes:
      - app_logs:/app/logs
    networks:
      - yourownapi_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────
  # Nginx — Reverse Proxy & SSL Termination
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: yourownapi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Mount SSL certs if available
      - nginx_logs:/var/log/nginx
    networks:
      - yourownapi_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
