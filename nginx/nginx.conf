# =============================================================================
# nginx/nginx.conf — Your Own API Reverse Proxy Configuration
# =============================================================================
# Routes: Port 80 (HTTP) → 301 redirect to HTTPS
#         Port 443 (HTTPS) → proxy_pass to api:8000
# SSL: Configured for Let's Encrypt / Certbot certificates
# =============================================================================

# Number of worker processes — set to auto to match CPU cores
worker_processes auto;

# Max open file descriptors per worker
worker_rlimit_nofile 65535;

events {
    # Max simultaneous connections per worker
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ─── Basic Settings ─────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from error responses (security hardening)
    server_tokens off;

    # Efficient file transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ─── Logging Format ─────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ─── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript;
    gzip_disable "MSIE [1-6]\.";

    # ─── Rate Limiting ──────────────────────────────────────────────────────
    # Limit to 60 requests/minute per IP at the Nginx layer (blunt instrument)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    # ─── Upstream — FastAPI Application ─────────────────────────────────────
    upstream yourownapi_api {
        # "api" resolves to the FastAPI container via Docker's internal DNS
        server api:8000;
        keepalive 32;
    }

    # ─── Server Block: HTTP → HTTPS Redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;   # Matches any hostname — replace with your domain in prod

        # Allow Let's Encrypt ACME challenges to pass through for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Server Block: HTTPS ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;   # Replace with your actual domain (e.g., api.yourdomain.com)

        # ── SSL Certificates ──────────────────────────────────────────────
        # These paths are for Let's Encrypt / Certbot.
        # For development, generate self-signed certs and place them here:
        #   openssl req -x509 -nodes -days 365 -newkey rsa:2048
        #     -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # ── SSL Hardening ─────────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — force browsers to use HTTPS for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security Headers ──────────────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Client Body Size ──────────────────────────────────────────────
        client_max_body_size 10M;
        client_body_timeout 12s;
        client_header_timeout 12s;

        # ── Proxy Configuration ───────────────────────────────────────────
        location / {
            # Apply rate limiting — burst of 20 requests, no delay
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://yourownapi_api;

            # Pass real client IP and protocol through to FastAPI
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for slow AI responses (streaming can be long)
            proxy_connect_timeout  10s;
            proxy_send_timeout     300s;   # 5 minutes for streaming
            proxy_read_timeout     300s;

            # Required for SSE (Server-Sent Events) streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CORS headers — handled by FastAPI, but mirrored here as fallback
            proxy_hide_header Access-Control-Allow-Origin;
        }

        # ── Health check — no rate limiting ──────────────────────────────
        location /health {
            proxy_pass http://yourownapi_api/health;
            proxy_set_header Host $host;
            access_log off;   # Don't log health check spam
        }
    }
}
